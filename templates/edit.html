<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Application | JobTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <strong>JobTrack</strong>
        <a href="/">Dashboard</a>
    </nav>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <p class="flash {{ category }}">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <h1>Edit Application</h1>
        <p>Update the details of your job application.</p>

        <form action="{{ url_for('edit_application', application_id=application['id']) }}"
              method="post">

            <label for="company">Company *</label>
            <input
                type="text"
                id="company"
                name="company"
                value="{{ application['company'] }}"
                required
            >

            <label for="job_title">Job title *</label>
            <input
                type="text"
                id="job_title"
                name="job_title"
                value="{{ application['job_title'] }}"
                required
            >

            <label for="date_applied">Date applied *</label>
            <input
                type="date"
                id="date_applied"
                name="date_applied"
                value="{{ application['date_applied'] }}"
                required
            >

            <label for="job_url">Job advertisement URL</label>
            <input
                type="url"
                id="job_url"
                name="job_url"
                value="{{ application['job_url'] or '' }}"
                placeholder="https://example.com/job"
            >

            <label for="notes">Notes</label>
            <textarea
                id="notes"
                name="notes"
                rows="5"
            >{{ application['notes'] or '' }}</textarea>

            <button type="submit">Save Changes</button>
            <a href="{{ url_for('details', application_id=application['id']) }}">
                Cancel
            </a>
        </form>
    </main>
</body>
</html>
